<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hide from usagi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 28px 0 22px;
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 400;
    }

    .image-wrap {
      position: relative;
      width: min(842px, 94vw);
      margin: 0 auto 28px;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .circle {
      position: absolute;
      width: 15%;
      aspect-ratio: 1;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .circle::after {
      position: absolute;
      top: 50%;
      width: max-content;
      padding: 5px 9px;
      color: #111;
      background: #fff;
      font-size: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .circle:hover::after,
    .circle:focus-visible::after {
      opacity: 1;
    }

    .circle:focus-visible {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    .circle-1 {
      left: 24%;
      top: 16%;
    }

    .circle-2 {
      left: 51%;
      top: 27%;
    }

    .circle-3 {
      left: 8%;
      top: 39%;
    }

    .circle-4 {
      left: 27%;
      top: 67%;
    }

    .circle-5 {
      left: 63%;
      top: 65%;
    }

    .circle-1::after,
    .circle-2::after,
    .circle-4::after {
      left: calc(100% + 12px);
    }

    .circle-3::after,
    .circle-5::after {
      right: calc(100% + 12px);
    }

    .circle-1::after {
      content: "circle 1";
    }

    .circle-2::after {
      content: "circle 2";
    }

    .circle-3::after {
      content: "circle 3";
    }

    .circle-4::after {
      content: "circle 4";
    }

    .circle-5::after {
      content: "circle 5";
    }
  </style>
</head>

<body>
  <h1>hide from usagi</h1>

  <div class="image-wrap">
    <img src="images/house1.png" alt="Floor plan with five red circles">

    <a class="circle circle-1" href="#circle-1" aria-label="Circle 1"></a>
    <a class="circle circle-2" href="#circle-2" aria-label="Circle 2"></a>
    <a class="circle circle-3" href="#circle-3" aria-label="Circle 3"></a>
    <a class="circle circle-4" href="#circle-4" aria-label="Circle 4"></a>
    <a class="circle circle-5" href="#circle-5" aria-label="Circle 5"></a>
  </div>
</body>
</html>
