<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hide from usagi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 28px 0 22px;
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 400;
    }

    .image-wrap {
      width: min(650px, 82vw);
      margin: 0 auto;
    }

    .map-wrap > img {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-wrap img.fatsagi {
      display: block;
      width: 18%;
      height: auto;
      margin: 18px auto 0;
    }

    .continue-button {
      position: absolute;
      top: 50%;
      left: calc(50% + min(325px, 41vw) + 12px);
      transform: translateY(-50%);
    }

    .page-layout {
      position: relative;
      width: 100%;
      padding: 0 24px 28px;
    }

    @media (max-width: 800px) {
      .page-layout {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .continue-button {
        position: static;
        transform: none;
        margin-top: 16px;
      }
    }
  </style>
</head>

<body>
  <h1>u chose to hide in the closet</h1>

  <div class="page-layout">
    <div class="image-wrap">
      <div class="map-wrap">
        <img src="images/house1_spot3.png">
      </div>

      <img class="fatsagi" src="images/fatsagi.png">
    </div>

    <a class="continue-button" href="play1.html">continue</a>
  </div>
</body>
</html>
