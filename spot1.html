<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>u chose to hide under the bed</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 28px 0 22px;
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 400;
    }

    .image-wrap {
      width: min(650px, 82vw);
      margin: 0 auto 28px;
    }

    .map-wrap > img {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-wrap img.fatsagi {
      display: block;
      width: 18%;
      height: auto;
      margin: 18px auto 0;
    }

    .continue-button {
      position: fixed;
      top: 50%;
      right: 24px;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>
  <h1>hide from usagi</h1>

  <div class="image-wrap">
    <div class="map-wrap">
      <img src="house1_spot1.png">
    </div>

    <img class="fatsagi" src="images/fatsagi.png">
  </div>

  <button class="continue-button" type="button">continue</button>
</body>
</html>
